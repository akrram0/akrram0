<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="now: building atlas-terminal, a gpu-accelerated terminal for windows, in rust, gpui and directx">
  <title>now: atlas-terminal</title>
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .meta { font-size: 20px; font-weight: 500; letter-spacing: 1.2px; }
      @keyframes ping { 0% { transform: scale(.55); opacity: .55; } 70%, 100% { transform: scale(1.9); opacity: 0; } }
      .ring { transform-box: fill-box; transform-origin: center; animation: ping 3.4s cubic-bezier(0, 0, 0.2, 1) infinite; }
      @media (prefers-reduced-motion: reduce) { .ring { animation: none; opacity: .3; transform: scale(1.25); } }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#000000" fill-opacity="0.05"/>
    </pattern>
    <pattern id="halftone" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.7" fill="#53366b" fill-opacity="0.20"/>
    </pattern>
    <radialGradient id="fade" cx="0.15" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="field">
      <rect x="0" y="0" width="1200" height="300" fill="url(#fade)"/>
    </mask>
  </defs>

  <rect x="0" y="0" width="1200" height="300" fill="#faf7f0"/>
  <rect x="0" y="0" width="1200" height="300" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="300" fill="url(#halftone)" mask="url(#field)"/>

  <text class="mono meta" x="72" y="68" fill="#666666">// now</text>
  <circle class="ring" cx="958" cy="62" r="10" fill="none" stroke="#2f7d32" stroke-width="1.5" opacity="0.3"/>
  <circle cx="958" cy="62" r="4.5" fill="#2f7d32"/>
  <text class="mono meta" x="1128" y="68" fill="#666666" text-anchor="end">in progress</text>

  <line x1="72" y1="88" x2="1128" y2="88" stroke="#000000" stroke-opacity="0.12" stroke-width="1"/>

  <text class="mono" x="72" y="166" font-size="54" font-weight="700" letter-spacing="-1.2" fill="#111111">atlas-terminal</text>
  <text class="mono" x="72" y="200" font-size="21" font-weight="400" letter-spacing="0.2" fill="#333333">the fastest gpu-accelerated terminal for windows.</text>
  <text class="mono" x="72" y="252" font-size="17" letter-spacing="0.6" fill="#666666">rust &#183; gpui &#183; directx &#183; 240hz &#183; zero electron</text>

  <g>
    <rect x="792" y="104" width="336" height="152" rx="10" fill="#0f1419"/>
    <line x1="792" y1="132" x2="1128" y2="132" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="810" cy="118" r="3.5" fill="#30363d"/>
    <circle cx="826" cy="118" r="3.5" fill="#30363d"/>
    <circle cx="842" cy="118" r="3.5" fill="#30363d"/>
    <g class="mono" font-size="11.5">
      <text x="812" y="160" fill="#6e7681"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> atlas --fps 240</tspan></text>
      <text x="812" y="184" fill="#8b949e">gpu 4.1 ms &#183; in 0.8 ms</text>
      <text x="812" y="208" fill="#8b949e">12 tabs &#183; no electron</text>
    </g>
    <rect x="812" y="228" width="7" height="12" fill="#3fb950"/>
  </g>
</svg>
