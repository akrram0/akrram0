<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="akram &#8212; builds fast, aesthetic software for windows">
  <title>akram &#8212; builds fast, aesthetic software for windows</title>
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .meta { font-size: 20px; font-weight: 500; letter-spacing: 1px; }
      @keyframes ping { 0% { transform: scale(.55); opacity: .55; } 70%, 100% { transform: scale(1.9); opacity: 0; } }
      .ring { transform-box: fill-box; transform-origin: center; animation: ping 3.4s cubic-bezier(0, 0, 0.2, 1) infinite; }
      @media (prefers-reduced-motion: reduce) { .ring { animation: none; opacity: .3; transform: scale(1.25); } }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#000000" fill-opacity="0.05"/>
    </pattern>
    <pattern id="halftone" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.7" fill="#53366b" fill-opacity="0.22"/>
    </pattern>
    <radialGradient id="fade" cx="0.78" cy="0.2" r="0.72">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="field">
      <rect x="0" y="0" width="1200" height="340" fill="url(#fade)"/>
    </mask>
  </defs>

  <rect x="0" y="0" width="1200" height="340" fill="#faf7f0"/>
  <rect x="0" y="0" width="1200" height="340" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="340" fill="url(#halftone)" mask="url(#field)"/>

  <circle class="ring" cx="82" cy="60" r="11" fill="none" stroke="#2f7d32" stroke-width="1.5" opacity="0.3"/>
  <circle cx="82" cy="60" r="5" fill="#2f7d32"/>

  <text class="mono meta" x="106" y="67" fill="#666666">building for windows</text>
  <text class="mono meta" x="1128" y="67" fill="#666666" text-anchor="end">github.com/akrram0</text>

  <text class="mono" x="72" y="182" font-size="96" font-weight="700" letter-spacing="-1" fill="#111111">AKRAM</text>
  <text class="mono" x="72" y="232" font-size="34" font-weight="500" letter-spacing="0.4" fill="#333333">builds fast, aesthetic software for windows</text>

  <line x1="72" y1="266" x2="1128" y2="266" stroke="#000000" stroke-opacity="0.12" stroke-width="1"/>

  <text class="mono meta" x="72" y="306" fill="#666666">terminal &#183; notes &#183; dock &#183; mascot</text>
  <text class="mono meta" x="1128" y="306" fill="#666666" text-anchor="end">rust &#183; c# &#183; kotlin &#183; typescript</text>
</svg>
