<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="noti — minimalist windows 11 notes app. local markdown, liquid glass on mica. winui 3 &#183; .net 8. github.com/akrram0/noti">
  <title>project 01: noti</title>
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#000000" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="120" fill="#faf7f0"/>
  <rect x="0" y="0" width="1200" height="120" fill="url(#grid)"/>

  <text class="mono" x="72" y="54" font-size="17" font-weight="500" letter-spacing="1.2" fill="#666666">01</text>
  <text class="mono" x="136" y="54" font-size="34" font-weight="700" letter-spacing="-0.6" fill="#111111">noti</text>
  <text class="mono" x="1128" y="54" text-anchor="end" font-size="17" font-weight="500" letter-spacing="1.2" fill="#666666">winui 3 &#183; .net 8</text>
  <text class="mono" x="136" y="88" font-size="21" font-weight="400" letter-spacing="0.2" fill="#333333">minimalist windows 11 notes app. local markdown, liquid glass on mica.</text>
  <text class="mono" x="1128" y="88" text-anchor="end" font-size="20" letter-spacing="0" fill="#666666">&#8599;</text>

  <line x1="72" y1="119" x2="1128" y2="119" stroke="#000000" stroke-opacity="0.12" stroke-width="1"/>
</svg>
